name: Deploy to Azure VMSS

on:
  push:
    branches: [ "master" ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build (Gradle)
        working-directory: ./SKU_Term
        run: |
          chmod +x gradlew
          ./gradlew clean build -x test

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Upload artifacts to Blob
        shell: bash
        run: |
          set -euo pipefail

          JAR_PATH=$(ls SKU_Term/build/libs/*.jar | head -n 1)
          SHA=${GITHUB_SHA::7}
          BLOB_JAR="app-${SHA}.jar"
          echo "BLOB_JAR=$BLOB_JAR" >> "$GITHUB_ENV"

          az storage blob upload \
            --account-name "${{ secrets.ST_ACCOUNT }}" \
            --container-name "${{ secrets.ST_CONTAINER }}" \
            --name "$BLOB_JAR" \
            --file "$JAR_PATH" \
            --overwrite true \
            --auth-mode login

      - name: Generate SAS (short-lived)
        shell: bash
        run: |
          set -euo pipefail

          EXPIRY=$(date -u -d "+1 hour" '+%Y-%m-%dT%H:%MZ')

          JAR_SAS=$(az storage blob generate-sas \
            --account-name "${{ secrets.ST_ACCOUNT }}" \
            --container-name "${{ secrets.ST_CONTAINER }}" \
            --name "$BLOB_JAR" \
            --permissions r \
            --expiry "$EXPIRY" \
            --https-only \
            --as-user \
            --auth-mode login \
            -o tsv)

          DEPLOY_SAS=$(az storage blob generate-sas \
            --account-name "${{ secrets.ST_ACCOUNT }}" \
            --container-name "${{ secrets.ST_CONTAINER }}" \
            --name "deploy.sh" \
            --permissions r \
            --expiry "$EXPIRY" \
            --https-only \
            --as-user \
            --auth-mode login \
            -o tsv)

          JAR_URL="https://${{ secrets.ST_ACCOUNT }}.blob.core.windows.net/${{ secrets.ST_CONTAINER }}/$BLOB_JAR?$JAR_SAS"
          DEPLOY_URL="https://${{ secrets.ST_ACCOUNT }}.blob.core.windows.net/${{ secrets.ST_CONTAINER }}/deploy.sh?$DEPLOY_SAS"

          echo "JAR_URL=$JAR_URL" >> "$GITHUB_ENV"
          echo "DEPLOY_URL=$DEPLOY_URL" >> "$GITHUB_ENV"

      - name: Reset + Set VMSS CustomScript (clean)
        shell: bash
        run: |
          set -euo pipefail

          RG="${{ secrets.RG_NAME }}"
          VMSS="${{ secrets.VMSS_NAME }}"

          az vmss extension list -g "$RG" --vmss-name "$VMSS" \
            --query "[].{name:name,publisher:publisher,type:type,version:typeHandlerVersion}" \
            -o table

          EXT_NAMES=$(az vmss extension list -g "$RG" --vmss-name "$VMSS" \
            --query "[?publisher=='Microsoft.Azure.Extensions' && type=='CustomScript'].name" \
            -o tsv)

          for n in $EXT_NAMES; do
            echo "Deleting VMSS extension: $n"
            az vmss extension delete -g "$RG" --vmss-name "$VMSS" -n "$n" || true
          done

          for i in {1..30}; do
            LEFT=$(az vmss extension list -g "$RG" --vmss-name "$VMSS" \
              --query "[?publisher=='Microsoft.Azure.Extensions' && type=='CustomScript'].name" \
              -o tsv)
            if [ -z "$LEFT" ]; then
              echo "All CustomScript extensions removed."
              break
            fi
            echo "Still present: $LEFT (retry $i)"
            sleep 5
          done

          LEFT=$(az vmss extension list -g "$RG" --vmss-name "$VMSS" \
            --query "[?publisher=='Microsoft.Azure.Extensions' && type=='CustomScript'].name" \
            -o tsv)
          if [ -n "$LEFT" ]; then
            echo "ERROR: Could not remove CustomScript extensions: $LEFT"
            exit 1
          fi

          cat > settings.json <<JSON
          { "fileUris": ["$DEPLOY_URL"] }
          JSON

          cat > protected.json <<JSON
          { "commandToExecute": "bash deploy.sh '$JAR_URL'" }
          JSON

          az vmss extension set \
            -g "$RG" --vmss-name "$VMSS" \
            --name CustomScript \
            --extension-instance-name DeployCSE \
            --publisher Microsoft.Azure.Extensions \
            --version 2.1 \
            --settings @settings.json \
            --protected-settings @protected.json \
            --force-update

          HAS_PUBLIC=$(az vmss extension show -g "$RG" --vmss-name "$VMSS" -n DeployCSE \
            --query "contains(keys(settings), 'commandToExecute')" -o tsv)
          if [ "$HAS_PUBLIC" = "true" ]; then
            echo "ERROR: commandToExecute is still in public settings. It must exist only in protectedSettings."
            exit 1
          fi

      - name: Apply to instances (Manual upgrade policy)
        shell: bash
        run: |
          set -euo pipefail

          RG="${{ secrets.RG_NAME }}"
          VMSS="${{ secrets.VMSS_NAME }}"

          IDS=$(az vmss list-instances -g "$RG" -n "$VMSS" --query "[].instanceId" -o tsv | tr '\n' ' ')
          az vmss update-instances -g "$RG" -n "$VMSS" --instance-ids $IDS
